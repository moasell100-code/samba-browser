<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAMBA Browser</title>
    <!-- 외부 요청은 전부 차단. 파비콘은 메인이 캐시해 둔 data: URL 로만 들어온다 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
  </head>

  <body>
    <main class="wrap">
      <h1 class="brand" id="brand">SAMBA Browser</h1>
      <form class="search" id="search-form">
        <!-- CSS 가 늦게 와도 커지지 않도록 크기·선 속성을 인라인으로도 둔다 -->
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <line x1="16.5" y1="16.5" x2="21" y2="21" />
        </svg>
        <input id="search-input" autocomplete="off" spellcheck="false" autofocus />
      </form>
      <section class="links" id="links" hidden></section>
    </main>
    <script type="module" src="./newtab/main.ts"></script>
  </body>
</html>
